# Copied to /etc/nginx/sites-available/ and symlinked into sites-enabled/
# during the one-time manual setup. Not touched by any CI workflow.
#
# Pre-Certbot: plain HTTP, proxies to the admin Next.js app on :3001.
# After running `sudo certbot --nginx -d laxmi.varnisha.com ...`, Certbot
# rewrites this file to add the 443 block + redirect — don't hand-write TLS.
server {
    listen 80;
    listen [::]:80;
    server_name laxmi.varnisha.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
