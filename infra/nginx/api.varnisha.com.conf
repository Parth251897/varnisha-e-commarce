# Copied to /etc/nginx/sites-available/ and symlinked into sites-enabled/
# during the one-time manual setup. Not touched by any CI workflow.
#
# Pre-Certbot: plain HTTP, proxies to the Express API on :3045.
# After running `sudo certbot --nginx -d api.varnisha.com ...`, Certbot
# rewrites this file to add the 443 block + redirect — don't hand-write TLS.
server {
    listen 80;
    listen [::]:80;
    server_name api.varnisha.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # multer's 5MB image cap + headroom — only the API subdomain accepts uploads
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3045;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
