# Copied to /etc/nginx/sites-available/ and symlinked into sites-enabled/
# during the one-time manual setup. Not touched by any CI workflow.
#
# Bare apex domain — canonical host, proxies to the user Next.js app on
# :3000. Pre-Certbot: plain HTTP. After running
# `sudo certbot --nginx -d varnisha.com`, Certbot rewrites this file to add
# the 443 block — don't hand-write TLS.
server {
    listen 80;
    listen [::]:80;
    server_name varnisha.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
