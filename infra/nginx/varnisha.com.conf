# Copied to /etc/nginx/sites-available/ and symlinked into sites-enabled/
# during the one-time manual setup. Not touched by any CI workflow.
#
# Bare apex domain — redirects everything to www.varnisha.com. Pre-Certbot:
# plain HTTP 301 redirect. After running `sudo certbot --nginx -d varnisha.com`,
# Certbot rewrites this file to add the 443 block — don't hand-write TLS.
server {
    listen 80;
    listen [::]:80;
    server_name varnisha.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.varnisha.com$request_uri;
    }
}
