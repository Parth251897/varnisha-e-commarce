# Copied to /etc/nginx/sites-available/ and symlinked into sites-enabled/
# during the one-time manual setup. Not touched by any CI workflow.
#
# This is the LIVE, Certbot-managed config (pulled from the box after the
# 2026-08-11 outage — this file and varnisha.com.conf were repaired earlier
# in that incident; api/laxmi were fixed later). Safe to re-`cp` to the box
# now — it already matches what's live. Do NOT replace this with a
# plain-HTTP-only version again; if you need to regenerate it from scratch,
# use `sudo certbot --nginx -d www.varnisha.com` (or `certbot install
# --cert-name api.varnisha.com -d www.varnisha.com` — note the cert lineage
# is named after api.varnisha.com and covers all 4 hostnames), don't
# hand-write the TLS block.
server {
    server_name www.varnisha.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://varnisha.com$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.varnisha.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.varnisha.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.varnisha.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.varnisha.com;
    return 404; # managed by Certbot


}
