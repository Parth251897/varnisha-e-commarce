# Copied to /etc/nginx/sites-available/ and symlinked into sites-enabled/
# during the one-time manual setup. Not touched by any CI workflow.
#
# www subdomain — redirects everything to the canonical bare apex
# varnisha.com. Pre-Certbot: plain HTTP 301 redirect. After running
# `sudo certbot --nginx -d www.varnisha.com`, Certbot rewrites this file to
# add the 443 block — don't hand-write TLS.
server {
    listen 80;
    listen [::]:80;
    server_name www.varnisha.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://varnisha.com$request_uri;
    }
}
